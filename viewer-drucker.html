<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Drucker – 3D-Ansicht mit Schnitt</title>
<style>
  :root{
    --ice-blue: #dbe6ef;
    --accent: #5fa8d3;
    --text-dark: #1b2226;
    --panel: rgba(28, 33, 38, 0.82);
    --panel-border: rgba(255,255,255,0.14);
    --text: #dfe4e8;
    --text-dim: #b7c0c9;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: 'Segoe UI', 'Inter', system-ui, sans-serif; background: var(--text-dark); color:#eef3f6; }
  .stage {
    position: relative; width:100%; height:100vh; min-height:560px; overflow:hidden;
    background:
      linear-gradient(180deg, rgba(10,16,20,0.55) 0%, rgba(10,16,20,0.15) 35%, rgba(10,16,20,0.65) 100%),
      url("https://d8j0ntlcm91z4.cloudfront.net/user_3DfbD5WkrijHyLK8T0Fz1iICbPR/hf_20260831_123235_72e91941-7e91-40e1-95b4-0162d8b28118.png");
    background-size: cover; background-position: center;
  }
  .top-bar { position:absolute; top:0; left:0; right:0; padding:28px clamp(20px,4vw,56px) 0; z-index:3; pointer-events:none; }
  .brand-name { font-size:0.78rem; letter-spacing:0.06em; color:var(--ice-blue); }
  .brand-name strong { display:block; font-size:1rem; letter-spacing:0.02em; color:#ffffff; }
  canvas { position:absolute; inset:0; width:100%; height:100%; z-index:2; }

  #panel {
    position:absolute; top:16px; right:16px; z-index:4;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:16px; width:250px; font-size:12.5px; backdrop-filter: blur(6px);
  }
  #panel h1 { font-size:13px; margin:0 0 12px 0; }
  .row { margin-bottom:14px; }
  .row label { display:flex; justify-content:space-between; color:var(--text-dim); font-size:11.5px; margin-bottom:6px; }
  .row label span.val { color:var(--text); font-family:monospace; }
  input[type=range] { width:100%; accent-color: var(--accent); }
  .axis-buttons { display:flex; gap:6px; margin-bottom:10px; }
  .axis-btn { flex:1; background:rgba(0,0,0,0.25); border:1px solid var(--panel-border); color:var(--text); padding:6px; border-radius:6px; font-size:12px; cursor:pointer; }
  .axis-btn.active { border-color: var(--accent); color: var(--accent); }
  .toggle-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .toggle-row input { accent-color: var(--accent); }
  #hint { font-size:11px; color:var(--text-dim); line-height:1.5; margin-top:6px; }

  .status-banner { position:absolute; top:0; left:0; right:0; z-index:5; color:#1b1400; font-size:0.82rem; padding:10px 20px; text-align:center; display:none; }
  .status-banner.error { background: rgba(200,60,60,0.92); color:#fff; display:block; }
  .status-banner.loading { background: rgba(180,120,20,0.92); display:block; }
</style>
</head>
<body>

<div class="status-banner loading" id="statusBanner">Modell wird geladen …</div>

<div class="stage" id="app">
  <div class="top-bar">
    <div class="brand-name"><strong>Drucker</strong></div>
  </div>

  <div id="panel">
    <h1>Druckkopf-Position</h1>
    <div class="axis-buttons">
      <div class="axis-btn active" data-axis="x">X</div>
      <div class="axis-btn" data-axis="y">Y</div>
      <div class="axis-btn" data-axis="z">Z</div>
    </div>
    <div class="row">
      <label>Verschiebung <span class="val" id="pos-val">0 mm</span></label>
      <input type="range" id="pos-slider" min="-300" max="300" value="0" step="1">
    </div>
    <div class="toggle-row">
      <input type="checkbox" id="flip-toggle">
      <label for="flip-toggle" style="margin:0; color:var(--text);">Richtung umkehren</label>
    </div>
    <div id="hint">Regler auf 0 = aktuelle (Druck-)Position aus der Datei. Verschieben, um die Ausgangsposition für den zweiten Screenshot zu finden.</div>
  </div>



<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MODEL_URL = "https://raw.githubusercontent.com/jonnytreude/Drucker/main/Drucker_final_v5.glb";
const MOVABLE_NODE_NAMES = [
  "Volumenkörper100_4", "Volumenkörper101_3", "Volumenkörper102_1", "Volumenkörper103_1",
  "Volumenkörper104_1", "Volumenkörper105_1", "Volumenkörper106_1", "Volumenkörper111_1",
  "Volumenkörper112_1", "Volumenkörper113_1", "Volumenkörper132_1", "Volumenkörper133_1",
  "Volumenkörper134_1", "Volumenkörper135_1", "Volumenkörper136_1", "Volumenkörper137_1",
  "Volumenkörper138_1", "Volumenkörper139_1", "Volumenkörper140_1", "Volumenkörper141_1",
  "Volumenkörper142_6", "Volumenkörper143_6", "Volumenkörper144_1", "Volumenkörper36_1",
  "Volumenkörper37_1", "Volumenkörper39_4", "Volumenkörper40_1", "Volumenkörper41_1",
  "Volumenkörper42_1", "Volumenkörper43_1", "Volumenkörper44_1", "Volumenkörper45_1",
  "Volumenkörper46_1", "Volumenkörper47_1", "Volumenkörper48_1", "Volumenkörper49_1",
  "Volumenkörper50_1", "Volumenkörper51_1", "Volumenkörper52_1", "Volumenkörper68_4",
  "Volumenkörper69_3", "Volumenkörper70_4", "Volumenkörper71_3", "Volumenkörper74_1",
  "Volumenkörper96_3", "Volumenkörper97_3", "Volumenkörper98_4", "Volumenkörper99_3"
];

const app = document.getElementById('app');
const statusBanner = document.getElementById('statusBanner');
// Fest eingestellte Schnittansicht (kein Regler mehr): Achse Z, Position 28%, Richtung umgekehrt
const FIXED_AXIS = 'z';
const FIXED_POSITION_PERCENT = 28;
const FIXED_FLIP = true;
const FIXED_CLIP_ENABLED = true;

let renderer, scene, camera, controls;
let root = null;
let boundsCenter = new THREE.Vector3();
let boundsRadius = 1;
let currentAxis = FIXED_AXIS;
let clipPlane = new THREE.Plane(new THREE.Vector3(1, 0, 0), 0);
const allMaterials = [];
let movableParts = [];
let posAxis = 'x';

const posSlider = document.getElementById('pos-slider');
const posVal = document.getElementById('pos-val');
const flipToggle = document.getElementById('flip-toggle');
const posAxisBtns = document.querySelectorAll('.axis-btn');

function findAllByNames(object, names) {
  const nameSet = new Set(names);
  const found = [];
  object.traverse(o => { if (nameSet.has(o.name)) found.push(o); });
  return found;
}

function updatePrintheadPosition() {
  if (movableParts.length === 0) return;
  const axisVec = { x: [1,0,0], y: [0,1,0], z: [0,0,1] }[posAxis];
  const flip = flipToggle.checked ? -1 : 1;
  const mmValue = parseFloat(posSlider.value);
  const offset = (mmValue / 1000) * flip;
  const worldOffset = new THREE.Vector3(axisVec[0], axisVec[1], axisVec[2]).multiplyScalar(offset);

  movableParts.forEach(({ object3D, basePosition, parentInverse }) => {
    const m = parentInverse.elements;
    const x = worldOffset.x, y = worldOffset.y, z = worldOffset.z;
    const localOffset = new THREE.Vector3(
      m[0]*x + m[4]*y + m[8]*z,
      m[1]*x + m[5]*y + m[9]*z,
      m[2]*x + m[6]*y + m[10]*z
    );
    object3D.position.copy(basePosition).add(localOffset);
  });
  posVal.textContent = Math.round(mmValue) + ' mm';
}

posAxisBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    posAxisBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    posAxis = btn.dataset.axis;
    updatePrintheadPosition();
  });
});
posSlider.addEventListener('input', updatePrintheadPosition);
flipToggle.addEventListener('change', updatePrintheadPosition);

function initThree() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 5000);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.localClippingEnabled = true;
  app.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x30343a, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 2.0);
  dir.position.set(3, 5, 2);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.6);
  dir2.position.set(-3, -1, -2);
  scene.add(dir2);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  window.addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  boundsCenter.copy(center);
  boundsRadius = Math.max(size.x, size.y, size.z) / 2 || 1;

  const dist = boundsRadius * 3.2;
  camera.position.copy(center).add(new THREE.Vector3(dist, dist * 0.6, dist));
  camera.near = boundsRadius / 50 || 0.01;
  camera.far = dist * 20 || 1000;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();
}

function collectMaterials(object) {
  object.traverse(o => {
    if (o.isMesh) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m => { if (m && !allMaterials.includes(m)) allMaterials.push(m); });
    }
  });
}

function computeClippedCenter(box, plane) {
  const corners = [];
  for (const x of [box.min.x, box.max.x])
    for (const y of [box.min.y, box.max.y])
      for (const z of [box.min.z, box.max.z])
        corners.push(new THREE.Vector3(x, y, z));
  const kept = corners.filter(c => plane.distanceToPoint(c) >= 0);
  if (kept.length === 0) return box.getCenter(new THREE.Vector3());
  const keptBox = new THREE.Box3().setFromPoints(kept);
  return keptBox.getCenter(new THREE.Vector3());
}

// Builds a bounding box of only the geometry that remains visible after
// clipping, by checking each individual part's box against the clip plane
// (much more accurate than one box around the whole model).
function computeClippedBox(object, plane) {
  const keptPoints = [];
  const tmpBox = new THREE.Box3();
  object.traverse(o => {
    if (!o.isMesh) return;
    tmpBox.setFromObject(o);
    if (tmpBox.isEmpty()) return;
    const corners = [];
    for (const x of [tmpBox.min.x, tmpBox.max.x])
      for (const y of [tmpBox.min.y, tmpBox.max.y])
        for (const z of [tmpBox.min.z, tmpBox.max.z])
          corners.push(new THREE.Vector3(x, y, z));
    const keptCorners = corners.filter(c => plane.distanceToPoint(c) >= -1e-6);
    // Only count this part if at least half its box is on the kept side,
    // so parts straddling the cut don't drag the box back toward the removed half.
    if (keptCorners.length >= 4) keptPoints.push(...keptCorners);
  });
  if (keptPoints.length === 0) return new THREE.Box3().setFromObject(object);
  return new THREE.Box3().setFromPoints(keptPoints);
}

function recenterOnClippedGeometry() {
  const keptBox = computeClippedBox(root, clipPlane);
  const newTarget = keptBox.getCenter(new THREE.Vector3());
  const size = keptBox.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) / 2 || boundsRadius;

  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = radius * 2.6;
  camera.position.copy(newTarget).add(dir.multiplyScalar(dist));
  camera.near = radius / 50 || 0.01;
  camera.far = dist * 20 || 1000;
  camera.updateProjectionMatrix();
  controls.target.copy(newTarget);
  controls.update();
}

function updateClipPlane() {
  const axisVec = { x: [1,0,0], y: [0,1,0], z: [0,0,1] }[currentAxis];
  const flip = FIXED_FLIP ? -1 : 1;
  const normal = new THREE.Vector3(axisVec[0]*flip, axisVec[1]*flip, axisVec[2]*flip);

  const t = FIXED_POSITION_PERCENT / 100; // -1..1
  const offsetAlongAxis = t * boundsRadius;
  const centerComponent = boundsCenter.dot(normal.clone().normalize());
  const constant = -(centerComponent + offsetAlongAxis);

  clipPlane.normal.copy(normal).normalize();
  clipPlane.constant = constant;

  const active = FIXED_CLIP_ENABLED;
  allMaterials.forEach(m => {
    m.clippingPlanes = active ? [clipPlane] : null;
    m.needsUpdate = true;
  });
}



function loadModel() {
  const loader = new GLTFLoader();
  const draco = new DRACOLoader();
  draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
  loader.setDRACOLoader(draco);

  loader.load(
    MODEL_URL,
    (gltf) => {
      root = gltf.scene;
      scene.add(root);
      collectMaterials(root);
      frameObject(root);
      updateClipPlane();
      recenterOnClippedGeometry();

      root.updateMatrixWorld(true);
      const foundNodes = findAllByNames(root, MOVABLE_NODE_NAMES);
      movableParts = foundNodes.map(obj => ({
        object3D: obj,
        basePosition: obj.position.clone(),
        parentInverse: new THREE.Matrix4().copy(obj.parent.matrixWorld).invert()
      }));

      statusBanner.style.display = 'none';
    },
    undefined,
    (err) => {
      statusBanner.textContent = 'Modell konnte nicht geladen werden.';
      statusBanner.className = 'status-banner error';
      console.error(err);
    }
  );
}

initThree();
loadModel();
</script>
</body>
</html>
